name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: Mod to release (nx project name). Leave empty to release every affected mod.
        required: false
        type: string
      specifier:
        description: patch, minor, major or an exact version. Leave empty to use conventional commits.
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CLAUDE_CODE_VERSION: 2.1.302

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      - run: pnpm nx run-many -t lint typecheck validate test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NX_PROJECT: ${{ inputs.project }}
          NX_SPECIFIER: ${{ inputs.specifier }}
        run: |
          args=(--skip-publish)
          if [ -n "$NX_PROJECT" ]; then args+=("--projects=$NX_PROJECT"); fi
          if [ -n "$NX_SPECIFIER" ]; then args+=("$NX_SPECIFIER"); fi
          if [ -z "$(git tag --list '*@*')" ]; then
            # nx bumps even a first release, so 0.1.0 would ship as 0.1.1: the first one is run by hand.
            if [ -z "$NX_SPECIFIER" ]; then
              echo "::notice::No release tag yet. Run the Release workflow with specifier 0.1.0 for the first release."
              exit 0
            fi
            args+=(--first-release)
          fi
          pnpm nx release "${args[@]}"

      - name: Back-merge main into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main"
            exit 0
          fi
          if git merge-base --is-ancestor origin/develop origin/main; then
            git push origin origin/main:develop
            exit 0
          fi
          git push origin origin/main:refs/heads/chore/back-merge-main --force
          gh pr create --base develop --head chore/back-merge-main \
            --title "chore(release): back-merge main into develop" \
            --body "Brings the release commits and tags from main back into develop." \
            || gh pr list --head chore/back-merge-main --base develop
