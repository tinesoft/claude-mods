<!doctype html>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sa { color-scheme: light; --page: #F5F6F8; --surface: #FFFFFF; --surface-2: #F9FAFB; --tile: #F5F6F8; --fill: #F0F1F4; --fill-2: #E8EAEE; --line: #DADCE1; --line-soft: #ECEDF0; --line-strong: #CFD2D8; --line-dashed: #B9BCC4; --ink: #17181C; --ink-2: #2A2D35; --text-2: #3B3F48; --muted: #5A5E68; --inverse-bg: #17181C; --on-ink: #FFFFFF; --switch-on: #17181C; --switch-off: #B9BCC4; --count-bg: rgba(23,24,28,0.07); --link-hover: #163A8F; --skill-fg: #1F4FC1; --skill-bg: #EDF2FD; --skill-bd: #C9D7F7; --agent-fg: #5B3A99; --agent-bg: #F3EEFB; --agent-bd: #D9CCF0; --mcp-fg: #9C1F62; --mcp-bg: #FCEEF5; --mcp-bd: #F0C8DC; --perm-fg: #0E6159; --perm-bg: #E8F5F2; --perm-bd: #BCE0D8; --hook-fg: #9A4A0B; --hook-bg: #FDF1E6; --hook-bd: #F0CFAE; --danger: #B42318; --danger-bd: #E8A39C; }
@media (prefers-color-scheme: dark) { .sa:not([data-theme="light"]) { color-scheme: dark; --page: #111214; --surface: #1B1D21; --surface-2: #1F2125; --tile: #26282D; --fill: #2A2C31; --fill-2: #2E3036; --line: #34373E; --line-soft: #2A2C31; --line-strong: #4A4E57; --line-dashed: #5A5F69; --ink: #ECEDEF; --ink-2: #D5D8DE; --text-2: #B4B8C1; --muted: #9499A3; --inverse-bg: #ECEDEF; --on-ink: #17181C; --switch-on: #5B7FE0; --switch-off: #4A4E57; --count-bg: rgba(255,255,255,0.10); --link-hover: #B7CBFF; --skill-fg: #8FB0FF; --skill-bg: #1B2A4A; --skill-bd: #2D4373; --agent-fg: #C3A8F5; --agent-bg: #2C2147; --agent-bd: #463470; --mcp-fg: #F29BC8; --mcp-bg: #3D1A2D; --mcp-bd: #63304A; --perm-fg: #7FD6C8; --perm-bg: #123A35; --perm-bd: #22594F; --hook-fg: #F5B47A; --hook-bg: #3D2614; --hook-bd: #643F20; --danger: #F97066; --danger-bd: #7A2E28; } }
.sa[data-theme="dark"] { color-scheme: dark; --page: #111214; --surface: #1B1D21; --surface-2: #1F2125; --tile: #26282D; --fill: #2A2C31; --fill-2: #2E3036; --line: #34373E; --line-soft: #2A2C31; --line-strong: #4A4E57; --line-dashed: #5A5F69; --ink: #ECEDEF; --ink-2: #D5D8DE; --text-2: #B4B8C1; --muted: #9499A3; --inverse-bg: #ECEDEF; --on-ink: #17181C; --switch-on: #5B7FE0; --switch-off: #4A4E57; --count-bg: rgba(255,255,255,0.10); --link-hover: #B7CBFF; --skill-fg: #8FB0FF; --skill-bg: #1B2A4A; --skill-bd: #2D4373; --agent-fg: #C3A8F5; --agent-bg: #2C2147; --agent-bd: #463470; --mcp-fg: #F29BC8; --mcp-bg: #3D1A2D; --mcp-bd: #63304A; --perm-fg: #7FD6C8; --perm-bg: #123A35; --perm-bd: #22594F; --hook-fg: #F5B47A; --hook-bg: #3D2614; --hook-bd: #643F20; --danger: #F97066; --danger-bd: #7A2E28; }
.sa a { color: var(--skill-fg); } .sa a:hover { color: var(--link-hover); }
.sa textarea::placeholder { color: var(--muted); }
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit}
</style>
</helmet>
<div class="sa" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--line); background: var(--surface)">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"></path></svg></button>
    <span style="flex-grow: 1; font-size: 15px; font-weight: 600; text-align: center">Release summary</span>
    <button aria-label="New chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 16px">
    <div style="align-self: flex-end; max-width: 85%; background: var(--fill-2); border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.5">Export the release summary as a Word file.</div>
    <div style="font-size: 15px; line-height: 1.6">Done. It's saved as <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; background: var(--fill-2); padding: 1px 6px; border-radius: 4px">release-summary.docx</span>. One command was stopped by a hook before it could print your .env file.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 16px">
    <div role="list" aria-label="Activated this session" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 16px">
      <div role="listitem" style="display: flex; flex-shrink: 0"><a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none">16 active<span style="width: 7px; height: 7px; border-radius: 50%; background: #B42318"></span></a></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Hook: block-secrets, blocked a call" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid var(--danger-bd); background: var(--hook-bg); color: var(--hook-fg); font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"></path></svg>block-secrets<span style="font-size: 11.5px; font-weight: 600; color: #FFFFFF; background: #B42318; padding: 1px 6px; border-radius: 5px">Blocked</span></button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Agent: code-reviewer" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid var(--agent-bd); background: var(--agent-bg); color: var(--agent-fg); font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="11" height="8" rx="2"></rect><path d="M8 2.5V5"></path><path d="M6 8.5v1M10 8.5v1"></path></svg>code-reviewer</button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Skill: docx" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid var(--skill-bd); background: var(--skill-bg); color: var(--skill-fg); font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2L14 5 8 8 2 5z"></path><path d="M2 8l6 3 6-3"></path><path d="M2 11l6 3 6-3"></path></svg>docx</button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Rule: Use pnpm, not npm, 2 times" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 13.5px; font-weight: 500; white-space: nowrap"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l5 2v4c0 3-2.2 5.2-5 6.4-2.8-1.2-5-3.4-5-6.4v-4z"></path></svg>Use pnpm<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; padding: 0 5px; border-radius: 5px; background: var(--count-bg)">×2</span></button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Hook: lint-staged, 4 times" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid var(--hook-bd); background: var(--hook-bg); color: var(--hook-fg); font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"></path></svg>lint-staged<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; padding: 0 5px; border-radius: 5px; background: var(--count-bg)">×4</span></button></div>
    </div>

    <div style="margin: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 8px 8px 14px; display: flex; flex-direction: column; gap: 6px">
      <label for="prompt3" class="sr">Message Claude</label>
      <textarea id="prompt3" rows="1" placeholder="Reply to Claude…" style="border: 0; outline: none; resize: none; font: inherit; font-size: 16px; line-height: 1.5; color: var(--ink); background: transparent; padding-top: 4px"></textarea>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="Add attachment" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--fill); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Send message" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--inverse-bg); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>

  renderVals() { return { theme: this.props.theme ?? 'auto' }; }
}
</script>
</body>
