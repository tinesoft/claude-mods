<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile chip rail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FC1}a:hover{color:#163a8f}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F8; color: #17181C; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid #E2E3E7; background: #FFFFFF">
    <button aria-label="Open menu" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3B3F48; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"></path></svg></button>
    <span style="flex-grow: 1; font-size: 15px; font-weight: 600; text-align: center">Release summary</span>
    <button aria-label="New chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #3B3F48; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 16px">
    <div style="align-self: flex-end; max-width: 85%; background: #E8EAEE; border-radius: 14px; padding: 10px 14px; font-size: 15px; line-height: 1.5">Export the release summary as a Word file.</div>
    <div style="font-size: 15px; line-height: 1.6">Done. It's saved as <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px; background: #E8EAEE; padding: 1px 6px; border-radius: 4px">release-summary.docx</span>. One command was stopped by a hook before it could print your .env file.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 0 16px">
    <div role="list" aria-label="Activated this session" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 16px">
      <div role="listitem" style="display: flex; flex-shrink: 0"><a href="#" style="min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; border: 1px solid #DADCE1; background: #FFFFFF; color: #17181C; font-size: 13.5px; font-weight: 600; text-decoration: none">16 active<span style="width: 7px; height: 7px; border-radius: 50%; background: #B42318"></span></a></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Hook: block-secrets, blocked a call" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid #E8A39C; background: #FDF1E6; color: #9A4A0B; font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"></path></svg>block-secrets<span style="font-size: 11.5px; font-weight: 600; color: #FFFFFF; background: #B42318; padding: 1px 6px; border-radius: 5px">Blocked</span></button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Agent: code-reviewer" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid #D9CCF0; background: #F3EEFB; color: #5B3A99; font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="11" height="8" rx="2"></rect><path d="M8 2.5V5"></path><path d="M6 8.5v1M10 8.5v1"></path></svg>code-reviewer</button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Skill: docx" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid #C9D7F7; background: #EDF2FD; color: #1F4FC1; font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 2L14 5 8 8 2 5z"></path><path d="M2 8l6 3 6-3"></path><path d="M2 11l6 3 6-3"></path></svg>docx</button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Rule: Use pnpm, not npm, 2 times" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid #CFD2D8; background: #FFFFFF; color: #2A2D35; font-size: 13.5px; font-weight: 500; white-space: nowrap"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.8l5 2v4c0 3-2.2 5.2-5 6.4-2.8-1.2-5-3.4-5-6.4v-4z"></path></svg>Use pnpm<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; padding: 0 5px; border-radius: 5px; background: rgba(23,24,28,0.07)">×2</span></button></div>
      <div role="listitem" style="display: flex; flex-shrink: 0"><button aria-label="Hook: lint-staged, 4 times" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 10px; border-radius: 12px; border: 1px solid #F0CFAE; background: #FDF1E6; color: #9A4A0B; font-size: 13.5px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 1.5L3.5 9H8l-1 5.5L12.5 7H8z"></path></svg>lint-staged<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; padding: 0 5px; border-radius: 5px; background: rgba(23,24,28,0.07)">×4</span></button></div>
    </div>

    <div style="margin: 0 12px; background: #FFFFFF; border: 1px solid #DADCE1; border-radius: 18px; padding: 10px 8px 8px 14px; display: flex; flex-direction: column; gap: 6px">
      <label for="prompt3" class="sr">Message Claude</label>
      <textarea id="prompt3" rows="1" placeholder="Reply to Claude…" style="border: 0; outline: none; resize: none; font: inherit; font-size: 16px; line-height: 1.5; color: #17181C; background: transparent; padding-top: 4px"></textarea>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="Add attachment" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #F0F1F4; color: #3B3F48; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Send message" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #17181C; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg></button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
