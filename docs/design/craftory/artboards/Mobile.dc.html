<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Craftory: mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sa { color-scheme: light; --page: #F5F6F8; --surface: #FFFFFF; --fill: #F0F1F4; --fill-2: #E8EAEE; --line: #DADCE1; --line-strong: #CFD2D8; --ink: #17181C; --ink-2: #2A2D35; --text-2: #3B3F48; --muted: #5A5E68; --inverse-bg: #17181C; --on-ink: #FFFFFF; --count-bg: rgba(23,24,28,0.07); --skill-fg: #1F4FC1; --skill-bg: #EDF2FD; --perm-fg: #0E6159; --perm-bg: #E8F5F2; --perm-bd: #BCE0D8; }
@media (prefers-color-scheme: dark) { .sa:not([data-theme="light"]) { color-scheme: dark; --page: #111214; --surface: #1B1D21; --fill: #2A2C31; --fill-2: #2E3036; --line: #34373E; --line-strong: #4A4E57; --ink: #ECEDEF; --ink-2: #D5D8DE; --text-2: #B4B8C1; --muted: #9499A3; --inverse-bg: #ECEDEF; --on-ink: #17181C; --count-bg: rgba(255,255,255,0.10); --skill-fg: #8FB0FF; --skill-bg: #1B2A4A; --perm-fg: #7FD6C8; --perm-bg: #123A35; --perm-bd: #22594F; } }
.sa[data-theme="dark"] { color-scheme: dark; --page: #111214; --surface: #1B1D21; --fill: #2A2C31; --fill-2: #2E3036; --line: #34373E; --line-strong: #4A4E57; --ink: #ECEDEF; --ink-2: #D5D8DE; --text-2: #B4B8C1; --muted: #9499A3; --inverse-bg: #ECEDEF; --on-ink: #17181C; --count-bg: rgba(255,255,255,0.10); --skill-fg: #8FB0FF; --skill-bg: #1B2A4A; --perm-fg: #7FD6C8; --perm-bg: #123A35; --perm-bd: #22594F; }
.sa a { color: var(--skill-fg); }
.mono{font-family: 'IBM Plex Mono', ui-monospace, monospace}
button{font:inherit}
</style>
</helmet>
<div class="sa" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--page); color: var(--ink); font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 12px 16px; gap: 14px; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 0 4px">
    <div style="align-self: flex-end; background: var(--fill-2); border-radius: 14px; padding: 10px 14px; font-size: 14px" class="mono">/to-tickets</div>
    <p style="margin: 0; font-size: 15px; line-height: 1.55">Split spec <a href="#">#42</a> into 5 tickets. Only #43 is unblocked.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <span style="font-size: 13px; font-weight: 600">Export invoices as CSV</span>
      <span class="mono" style="font-size: 12px; color: var(--muted)">3/7</span>
    </div>
    <div role="list" aria-label="SDLC phases" style="display: flex; gap: 6px; overflow-x: auto; padding: 0 4px 4px">
      <sc-for list="{{phases}}" as="p" hint-placeholder-count="7">
        <div role="listitem" style="display: flex; flex-shrink: 0">
          <button aria-label="{{p.aria}}" style="height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border-radius: 10px; border: 1px solid {{p.bd}}; background: {{p.bg}}; color: {{p.fg}}; font-size: 13.5px; font-weight: {{p.weight}}; cursor: pointer; white-space: nowrap">
            <span class="mono" style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid {{p.dotBd}}; background: {{p.dotBg}}; color: {{p.dotFg}}; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; box-sizing: border-box">{{p.mark}}</span>{{p.label}}
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 10px 14px; display: flex; flex-direction: column; gap: 8px">
    <label for="mp" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message Claude</label>
    <textarea id="mp" rows="2" placeholder="Reply to Claude…" style="border: 0; outline: none; resize: none; font: inherit; font-size: 15px; line-height: 1.5; color: var(--ink); background: transparent"></textarea>
    <div style="display: flex; align-items: center; gap: 8px">
      <button class="mono" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--skill-bg); color: var(--skill-fg); font-size: 12.5px; cursor: pointer">/implement #43</button>
      <span style="flex-grow: 1"></span>
      <button aria-label="Send message" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--inverse-bg); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["auto","light","dark"],"default":"auto"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = [['Align', 'done'], ['Spec', 'done'], ['Tickets', 'done'], ['Build', 'next'], ['Review', 'todo'], ['Ship', 'todo'], ['Retro', 'todo']];
    var phases = P.map(function (p, i) {
      var d = p[1] === 'done', n = p[1] === 'next';
      return { label: p[0], mark: d ? '✓' : String(i + 1), aria: 'Phase ' + (i + 1) + ', ' + p[0] + (d ? ', done' : n ? ', up next' : ''),
        bd: n ? 'var(--skill-fg)' : 'var(--line)', bg: n ? 'var(--skill-bg)' : 'var(--surface)', fg: n ? 'var(--skill-fg)' : (d ? 'var(--ink)' : 'var(--text-2)'), weight: n ? '600' : '500',
        dotBg: d ? 'var(--perm-bg)' : 'transparent', dotBd: d ? 'var(--perm-bd)' : (n ? 'var(--skill-fg)' : 'var(--line-strong)'), dotFg: d ? 'var(--perm-fg)' : (n ? 'var(--skill-fg)' : 'var(--muted)') };
    });
    return { theme: this.props.theme ?? 'auto', phases: phases };
  }
}
</script>
</body>
</html>
